<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a0533"/>
      <stop offset="0.5" stop-color="#2d1b69"/>
      <stop offset="1" stop-color="#0a0118"/>
    </linearGradient>
    <linearGradient id="glow" x1="300" y1="0" x2="300" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c3aed" stop-opacity="0.35"/>
